# HDCマイクラ部 サイト設定
#
# このファイルはサイト全体に関わる設定です。
# 変更した場合は `bundle exec jekyll serve` を再起動してください。

# サイト設定
title: HDCマイクラ部
# email を設定するとフッターに公開されます。サイトは一般公開のため空にしています。
email:
description: >- # baseurl: までの改行は無視されます
  HDCマイクラ部の活動記録サイトです。
  サーバーでの建築、イベント、部員の紹介などを記録していきます。
baseurl: "/hdc-mine-club" # サイトのサブパス（例: /blog）
url: "https://hdc-lyu.github.io" # ホスト名とプロトコル

# 日本語のサイトであることをブラウザ・読み上げ・SNSに伝えます
lang: ja
locale: ja_JP

# LINE や Teams などでリンクを共有したときのプレビュー画像を大きく表示します
twitter:
  card: summary_large_image

# 部員一覧。_members/ の1ファイルが1人分で、そのまま自己紹介ページになります。
# URLは /members/ファイル名/ です。
collections:
  members:
    output: true

# _members/ の各ファイルに毎回 layout を書かなくて済むようにします
defaults:
  - scope:
      path: ""
      type: members
    values:
      layout: member
  # 共有プレビュー用の既定の画像。写真つきの記事は thumbnail の写真が使われます
  # （_plugins/thumbnail_image.rb）
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# 活動記録のURL（カテゴリ名がURLに入らないようにしています）
permalink: /activities/:year/:month/:day/:title/

# ヘッダーに表示するページと順番
header_pages:
  - members.markdown
  - activities.markdown
  - about.markdown

# minima テーマの表示設定
minima:
  date_format: "%Y年%-m月%-d日"

show_excerpts: true

# ビルド設定
theme: minima
plugins:
  - jekyll-feed

# 処理対象から除外する項目
# 下記の項目は既定で処理されません。
# ここで `exclude:` に列挙した項目は内部の除外リストに追加されます。
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
